{{ define "main" }}
  <main>
    <article class="article">
      {{ if eq .Section "blog" }}
        <header class="article-header">
          <h1>{{ .Title }}</h1>
          <p>{{ .Date.Format "January 2, 2006" }}</p>
        </header>
      {{ end }}
      <div class="prose">
        {{ .Content }}
      </div>
    </article>
  </main>
{{ end }}
